name: Build WorkPulse APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q workpulse.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Prepare Android project
        working-directory: workpulse
        run: bash tool/prepare_android.sh

      - name: Get packages
        working-directory: workpulse
        run: flutter pub get

      - name: Build release APK
        working-directory: workpulse
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-APK
          path: workpulse/build/app/outputs/flutter-apk/app-release.apk
